<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sine Wave Sampling Demo</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    min-height: 100vh;
  }
  h1 {
    text-align: center;
    padding: 18px 0 6px;
    font-size: 1.6rem;
    color: #7eb8ff;
    letter-spacing: 1px;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 40px;
    padding: 12px 20px 8px;
    flex-wrap: wrap;
  }
  .control-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 220px;
  }
  .control-group label {
    font-size: 0.85rem;
    color: #aaa;
    margin-bottom: 4px;
  }
  .control-group .value {
    font-size: 1.1rem;
    font-weight: 700;
    color: #ffd866;
    margin-bottom: 2px;
    min-width: 80px;
    text-align: center;
  }
  input[type="range"] {
    width: 240px;
    accent-color: #7eb8ff;
    cursor: pointer;
  }
  .plots {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 6px;
    padding: 6px 10px 10px;
    height: calc(100vh - 150px);
    min-height: 500px;
  }
  .plot-cell {
    background: #1a1a2e;
    border-radius: 8px;
    overflow: hidden;
  }
  .info-bar {
    text-align: center;
    font-size: 0.82rem;
    color: #888;
    padding: 2px 0 4px;
  }
  .info-bar span { color: #ff6b6b; font-weight: 700; }
</style>
</head>
<body>

<h1>Sine Wave Sampling &amp; Frequency Domain</h1>

<div class="controls">
  <div class="control-group">
    <label>Signal Frequency (Hz)</label>
    <div class="value" id="freqVal">5 Hz</div>
    <input type="range" id="freq" min="1" max="50" step="0.5" value="5">
  </div>
  <div class="control-group">
    <label>Time Window (s)</label>
    <div class="value" id="timeVal">1.0 s</div>
    <input type="range" id="timeWin" min="0.1" max="3" step="0.05" value="1">
  </div>
  <div class="control-group">
    <label>Sampling Frequency (Hz)</label>
    <div class="value" id="fsVal">20 Hz</div>
    <input type="range" id="fs" min="2" max="200" step="1" value="20">
  </div>
</div>

<div class="info-bar">
  Nyquist criterion: f<sub>s</sub> &ge; 2f &rarr; need <span id="nyquistNeed">10</span> Hz.
  Current f<sub>s</sub> = <span id="nyquistHave">20</span> Hz &mdash;
  <span id="nyquistStatus" style="color:#66ff99">OK (no aliasing)</span>
</div>

<div class="plots">
  <div class="plot-cell" id="timeCont"></div>
  <div class="plot-cell" id="freqCont"></div>
  <div class="plot-cell" id="timeSamp"></div>
  <div class="plot-cell" id="freqSamp"></div>
</div>

<script>
const darkLayout = {
  paper_bgcolor: '#1a1a2e',
  plot_bgcolor: '#1a1a2e',
  font: { color: '#ccc', size: 11 },
  margin: { l: 52, r: 18, t: 32, b: 38 },
  xaxis: { gridcolor: '#2a2a44', zerolinecolor: '#3a3a5a' },
  yaxis: { gridcolor: '#2a2a44', zerolinecolor: '#3a3a5a' },
};

const plotConfig = { responsive: true, displayModeBar: false };

// FFT implementation (radix-2 Cooley-Tukey)
function fft(re, im) {
  const n = re.length;
  if (n <= 1) return;

  // bit-reversal permutation
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) {
      [re[i], re[j]] = [re[j], re[i]];
      [im[i], im[j]] = [im[j], im[i]];
    }
  }

  for (let len = 2; len <= n; len *= 2) {
    const ang = -2 * Math.PI / len;
    const wRe = Math.cos(ang), wIm = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let curRe = 1, curIm = 0;
      for (let j = 0; j < len / 2; j++) {
        const tRe = curRe * re[i + j + len / 2] - curIm * im[i + j + len / 2];
        const tIm = curRe * im[i + j + len / 2] + curIm * re[i + j + len / 2];
        re[i + j + len / 2] = re[i + j] - tRe;
        im[i + j + len / 2] = im[i + j] - tIm;
        re[i + j] += tRe;
        im[i + j] += tIm;
        const newCurRe = curRe * wRe - curIm * wIm;
        curIm = curRe * wIm + curIm * wRe;
        curRe = newCurRe;
      }
    }
  }
}

function nextPow2(n) {
  let p = 1;
  while (p < n) p *= 2;
  return p;
}

function computeMagnitudeSpectrum(signal, sampleRate) {
  const N = Math.max(nextPow2(signal.length), 1024);
  const re = new Float64Array(N);
  const im = new Float64Array(N);
  for (let i = 0; i < signal.length; i++) re[i] = signal[i];

  fft(re, im);

  const halfN = N / 2;
  const freqs = [], mags = [];
  for (let i = 0; i <= halfN; i++) {
    freqs.push((i * sampleRate) / N);
    mags.push(Math.sqrt(re[i] * re[i] + im[i] * im[i]) / signal.length * 2);
  }
  return { freqs, mags };
}

function update() {
  const f = parseFloat(document.getElementById('freq').value);
  const T = parseFloat(document.getElementById('timeWin').value);
  const fs = parseFloat(document.getElementById('fs').value);

  document.getElementById('freqVal').textContent = f + ' Hz';
  document.getElementById('timeVal').textContent = T.toFixed(2) + ' s';
  document.getElementById('fsVal').textContent = fs + ' Hz';

  const nyquist = 2 * f;
  document.getElementById('nyquistNeed').textContent = nyquist;
  document.getElementById('nyquistHave').textContent = fs;
  const ok = fs >= nyquist;
  const statusEl = document.getElementById('nyquistStatus');
  statusEl.textContent = ok ? 'OK (no aliasing)' : 'ALIASING!';
  statusEl.style.color = ok ? '#66ff99' : '#ff6b6b';

  // Continuous signal (high-res for smooth curve)
  const dtCont = 1 / 2000;
  const nCont = Math.round(T / dtCont);
  const tCont = [], yCont = [];
  for (let i = 0; i <= nCont; i++) {
    const t = i * dtCont;
    tCont.push(t);
    yCont.push(Math.sin(2 * Math.PI * f * t));
  }

  // Sampled signal
  const dt = 1 / fs;
  const nSamp = Math.floor(T * fs);
  const tSamp = [], ySamp = [];
  for (let i = 0; i <= nSamp; i++) {
    const t = i * dt;
    tSamp.push(t);
    ySamp.push(Math.sin(2 * Math.PI * f * t));
  }

  // --- Time domain: continuous ---
  Plotly.react('timeCont', [
    { x: tCont, y: yCont, type: 'scatter', mode: 'lines',
      line: { color: '#7eb8ff', width: 2 }, name: 'sin(2\u03c0ft)' }
  ], {
    ...darkLayout,
    title: { text: 'Continuous Signal (Time Domain)', font: { size: 13, color: '#7eb8ff' } },
    xaxis: { ...darkLayout.xaxis, title: 'Time (s)' },
    yaxis: { ...darkLayout.yaxis, title: 'Amplitude', range: [-1.3, 1.3] },
  }, plotConfig);

  // --- Time domain: sampled ---
  Plotly.react('timeSamp', [
    { x: tCont, y: yCont, type: 'scatter', mode: 'lines',
      line: { color: '#7eb8ff33', width: 1.5 }, name: 'original', showlegend: true },
    { x: tSamp, y: ySamp, type: 'scatter', mode: 'markers',
      marker: { color: '#ff6b6b', size: 7, symbol: 'circle' }, name: 'samples' },
    // stem lines
    ...tSamp.map((t, i) => ({
      x: [t, t], y: [0, ySamp[i]], type: 'scatter', mode: 'lines',
      line: { color: '#ff6b6b88', width: 1.2 }, showlegend: false, hoverinfo: 'skip'
    }))
  ], {
    ...darkLayout,
    title: { text: `Sampled at f_s = ${fs} Hz (Time Domain)`, font: { size: 13, color: '#ff6b6b' } },
    xaxis: { ...darkLayout.xaxis, title: 'Time (s)' },
    yaxis: { ...darkLayout.yaxis, title: 'Amplitude', range: [-1.3, 1.3] },
    showlegend: true,
    legend: { x: 0.01, y: 0.99, bgcolor: 'rgba(0,0,0,0)' },
  }, plotConfig);

  // --- Frequency domain: continuous (analytical) ---
  // Show a sharp peak at f Hz
  const freqMax = Math.max(f * 4, fs * 1.2, 60);
  const fAxis = [];
  for (let i = 0; i <= 500; i++) fAxis.push(i * freqMax / 500);
  // Approximate delta-like peak using narrow Gaussian
  const sigma = 0.3;
  const fMag = fAxis.map(x => Math.exp(-((x - f) ** 2) / (2 * sigma * sigma)));

  Plotly.react('freqCont', [
    { x: fAxis, y: fMag, type: 'scatter', mode: 'lines',
      line: { color: '#66ff99', width: 2.5 }, fill: 'tozeroy',
      fillcolor: 'rgba(102,255,153,0.15)', name: '|X(f)|' }
  ], {
    ...darkLayout,
    title: { text: 'Continuous Spectrum (Freq Domain)', font: { size: 13, color: '#66ff99' } },
    xaxis: { ...darkLayout.xaxis, title: 'Frequency (Hz)', range: [0, freqMax] },
    yaxis: { ...darkLayout.yaxis, title: 'Magnitude', rangemode: 'tozero' },
  }, plotConfig);

  // --- Frequency domain: sampled (DFT) ---
  const spec = computeMagnitudeSpectrum(ySamp, fs);

  // Also show aliases beyond fs/2 conceptually: replicate spectrum
  const aliasFreqs = [], aliasMags = [];
  // Show replicas at k*fs +/- f for visual
  const shapes = [];
  if (!ok) {
    // Mark aliased frequency
    const fAlias = Math.abs(f - fs * Math.round(f / fs));
    shapes.push({
      type: 'line', x0: fAlias, x1: fAlias, y0: 0, y1: 1,
      line: { color: '#ff6b6b', width: 1.5, dash: 'dash' },
      xref: 'x', yref: 'paper'
    });
  }
  // Mark Nyquist
  shapes.push({
    type: 'line', x0: fs / 2, x1: fs / 2, y0: 0, y1: 1,
    line: { color: '#ffd86688', width: 1.5, dash: 'dot' },
    xref: 'x', yref: 'paper'
  });

  Plotly.react('freqSamp', [
    { x: spec.freqs, y: spec.mags, type: 'scatter', mode: 'lines',
      line: { color: '#ffd866', width: 2 }, fill: 'tozeroy',
      fillcolor: 'rgba(255,216,102,0.12)', name: '|X[k]|' }
  ], {
    ...darkLayout,
    title: { text: `Sampled Spectrum (DFT, f_s=${fs} Hz)`, font: { size: 13, color: '#ffd866' } },
    xaxis: { ...darkLayout.xaxis, title: 'Frequency (Hz)', range: [0, Math.min(fs / 2 + 5, freqMax)] },
    yaxis: { ...darkLayout.yaxis, title: 'Magnitude', rangemode: 'tozero' },
    shapes: shapes,
    annotations: [
      { x: fs / 2, y: 1.05, xref: 'x', yref: 'paper', text: 'f_s/2', showarrow: false,
        font: { color: '#ffd866', size: 10 } }
    ],
  }, plotConfig);
}

// Debounced update for smooth slider interaction
let raf = null;
function scheduleUpdate() {
  if (raf) cancelAnimationFrame(raf);
  raf = requestAnimationFrame(update);
}

document.getElementById('freq').addEventListener('input', scheduleUpdate);
document.getElementById('timeWin').addEventListener('input', scheduleUpdate);
document.getElementById('fs').addEventListener('input', scheduleUpdate);

// Initial render
update();
</script>
</body>
</html>
