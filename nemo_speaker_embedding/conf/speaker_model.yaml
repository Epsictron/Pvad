# NeMo Speaker Embedding — Custom Encoder Config
# Uses EncDecSpeakerLabelModel with a custom TDNN-SE backbone.

name: "SpeakerModel"
exp_dir: "./experiments"

trainer:
  devices: 1
  accelerator: "auto"            # "gpu" if CUDA available, else "cpu"
  max_epochs: 50
  accumulate_grad_batches: 1
  precision: "32-true"           # use "16-mixed" for AMP on GPU
  log_every_n_steps: 10
  val_check_interval: 1.0
  enable_checkpointing: true

model:
  sample_rate: 16000

  train_ds:
    manifest_filepath: dummy_data/train_manifest.json
    sample_rate: 16000
    labels: null
    batch_size: 16
    shuffle: true
    num_workers: 2
    pin_memory: true
    min_duration: 1.0
    max_duration: 16.0

  validation_ds:
    manifest_filepath: dummy_data/val_manifest.json
    sample_rate: 16000
    batch_size: 16
    shuffle: false
    num_workers: 2

  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    window_size: 0.025
    window_stride: 0.01
    window: "hann"
    normalize: "per_feature"
    n_fft: 512
    features: 80
    sample_rate: 16000
    dither: 0.00001
    pad_to: 0
    preemph: 0.97

  # ── Custom encoder — swap _target_ to use NeMo's built-in if desired ──
  # Built-in alternative:
  #   _target_: nemo.collections.asr.modules.ConvASREncoder
  encoder:
    _target_: custom_model.encoder.CustomSpeakerEncoder
    feat_in: 80
    feat_out: 1536

  decoder:
    _target_: nemo.collections.asr.modules.SpeakerDecoder
    feat_in: 1536
    num_classes: 10               # must match number of speakers in training data
    pool_mode: "xvector"          # "xvector" (stats), "attention", "tap"
    emb_sizes: [256]              # final embedding dim = 256
    angular: false                # set true + add angular loss for verification

  optim:
    name: adam
    lr: 0.001
    weight_decay: 0.0001
    sched:
      name: CosineAnnealing
      warmup_steps: 100
      min_lr: 0.00001
